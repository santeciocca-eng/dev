<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dev App">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Dev App</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:white;border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.1)}h1{margin:0 0 10px;font-size:32px}p{line-height:1.55;color:#4b5563}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:#111827;color:#fff;cursor:pointer;margin-top:12px}small{display:block;margin-top:20px;color:#6b7280}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">PWA pronta</span>
    <h1>Dev App</h1>
    <p>Applicazione web installabile su Android e iPhone. Funziona anche offline dopo il primo caricamento.</p>
    <button id="install" hidden>Installa app</button>
    <small id="ios"></small>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    let deferredPrompt;
    const install=document.getElementById('install');
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.hidden=false});
    install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.hidden=true});
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if(ios&&!standalone) document.getElementById('ios').textContent='Su iPhone: Safari → Condividi → Aggiungi alla schermata Home.';
  </script>
</body>
</html>
